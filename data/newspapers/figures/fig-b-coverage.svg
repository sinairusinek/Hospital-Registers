<text x="38.0" y="32.0" class="ink" font-size="15" text-anchor="start" font-weight="600">Figure B · What the press never mentioned</text>
<text x="38.0" y="52.0" class="ink-2" font-size="11.5" text-anchor="start">Every surge the register defines on its own, 1930–1948, in chronological order.</text>

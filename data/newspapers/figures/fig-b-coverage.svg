<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 496" width="800" height="496" class="fig" role="img" aria-labelledby="t d">
<title id="t">What the press never mentioned</title><desc id="d">Dot matrix, one mark per register surge, filled where a Haifa press report falls within 60 days.</desc>

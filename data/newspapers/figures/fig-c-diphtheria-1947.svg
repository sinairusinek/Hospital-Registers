<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" class="fig" role="img" aria-labelledby="t d">
<title id="t">Diphtheria in Haifa, 1947</title><desc id="d">Bar chart of monthly register admissions with press report-days as ticks beneath and uncovered months shaded.</desc>
<style>
  .fig { font-family: 'Iowan Old Style', Palatino, Georgia, serif; }
  .surface { fill: #fcfcfb; }
  .ink     { fill: #0b0b0b; }
  .ink-2   { fill: #52514e; }
  .ink-3   { fill: #898781; }
  .rule    { stroke: #d9d8d2; stroke-width: 1; fill: none; }
  .rule-0  { stroke: #898781; stroke-width: 1; fill: none; }
  .reg     { fill: #2a78d6; }
  .reg-s   { stroke: #2a78d6; fill: none; }
  .press   { fill: #eb6834; }
  .absent  { fill: #dcdbd5; }
  .ring    { stroke: #fcfcfb; stroke-width: 1.5; }
  .on-reg  { fill: #ffffff; }
  .press-s { stroke: #eb6834; stroke-width: 2.5; }
</style>
<rect width="800" height="450" class="surface"/>
<text x="38.0" y="32.0" class="ink" font-size="15" text-anchor="start" font-weight="600">Figure C · Diphtheria in Haifa, 1947</text>
<text x="38.0" y="52.0" class="ink-2" font-size="11.5" text-anchor="start">The register’s admissions month by month, the press report-days beneath, and the months the register does not cover.</text>
<text x="38.0" y="68.0" class="ink-3" font-size="10.5" text-anchor="start">Press ticks include the weaker paragraph tier, so the months the register cannot cover are not left artificially empty.</text>

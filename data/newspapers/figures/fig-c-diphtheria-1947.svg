<line x1="697.7" y1="343" x2="697.7" y2="361" class="press-s"/>
<line x1="703.3" y1="343" x2="703.3" y2="361" class="press-s"/>
<text x="82.0" y="356.0" class="press" font-size="11.5" text-anchor="end" font-weight="600">press</text>
<text x="82.0" y="116.0" class="reg" font-size="11.5" text-anchor="end" font-weight="600">register</text>
<text x="92.0" y="388.0" class="ink-2" font-size="11" text-anchor="start">The paper speaks in October, five weeks in — and again in August and November, where the register cannot answer.</text>
<text x="92.0" y="408.0" class="ink-3" font-size="10.5" text-anchor="start">Months shaded grey have no surviving register pages; an empty month there is an absence of evidence, not of disease.</text>
</svg>

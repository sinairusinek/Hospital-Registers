<rect x="485.2" y="100" width="56.2" height="248" class="absent" opacity="0.55"/>
<text x="513.2" y="317.0" class="ink-3" font-size="10.5" text-anchor="middle">Aug</text>
<text x="569.4" y="317.0" class="ink-3" font-size="10.5" text-anchor="middle">Sep</text>
<text x="625.6" y="317.0" class="ink-3" font-size="10.5" text-anchor="middle">Oct</text>
<rect x="653.7" y="100" width="56.2" height="248" class="absent" opacity="0.55"/>
<text x="681.8" y="317.0" class="ink-3" font-size="10.5" text-anchor="middle">Nov</text>
<rect x="709.8" y="100" width="56.2" height="248" class="absent" opacity="0.55"/>

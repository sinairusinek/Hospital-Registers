<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 564" width="840" height="564" class="fig" role="img" aria-labelledby="t d">
<title id="t">How late the press was</title><desc id="d">Dot plot, one dot per Haifa press report-day, x is days between the register's surge onset and the report, faceted by disease.</desc>
<style>

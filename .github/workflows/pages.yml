name: Deploy app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'data/public/**'
      - 'sources/**'
      - 'data/newspapers/heb_article_readings.md'
      - 'pipeline/build.py'
      - 'pipeline/source_registry.py'
      - 'pipeline/timeline_data.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Builds data/public/hospital-registers-normalized.tsv, which is not
      # committed: it is 15 MB and fully derived from the consolidated TSV.
      - run: python3 pipeline/build.py
      # The clickable-source registry: 243 entries generated from the Hebrew
      # readings plus the 35 hand-authored rows in sources/press/. Both inputs
      # are public, so this reproduces the committed registry exactly.
      - run: python3 pipeline/source_registry.py
      # The Timeline view's four layers. Regenerated rather than taken from the
      # commit so a change to the readings or the events file reaches the site
      # without a manual rebuild; timeline_data.py refuses to publish a
      # sourceless payload over a sourced one.
      - run: python3 pipeline/timeline_data.py
      # The registry is a committed artifact built from two public inputs, so
      # a clean rebuild must reproduce it byte for byte. If it does not, the
      # committed file was written from something not in the repo — the state
      # this whole change exists to prevent — so fail rather than publish it.
      #
      # timeline.json is deliberately NOT checked this way. It also depends on
      # the register itself, which pipeline/build.py regenerates, so its counts
      # move whenever that changes; pinning it here would turn an unrelated
      # data fix into a red build. The rebuild above is what ships.
      - name: Verify the committed source registry matches a clean rebuild
        run: git diff --exit-code -- data/public/sources-registry.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
